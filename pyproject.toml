[project]
name = "kev-analyzer"
version = "0.1.0"
description = "Analyze the CISA Known Exploited Vulnerabilities catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
kev-analyzer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "fetch.py",
    "parse.py",
    "analyze.py",
]
